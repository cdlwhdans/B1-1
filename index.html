<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
    <title>포트폴리오</title>
</head>
<body>
    <header id="top">
        <nav>
            <a href="#hero">Portfolio</a>

            <button
                class="menu-toggle"
                type="button"
                aria-controls="site-menu"
                aria-expanded="false"
            >
                메뉴
            </button>

            <ul id="site-menu">
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>

            <button class="theme-toggle" type="button">다크 모드</button>
        </nav>
    </header>

    <main>
        <section id="hero">
            <h1>이종문</h1>
            <p>안녕하세요.</p>
            <a href="#projects">프로젝트 보기</a>
        </section>

        <section id="about">
            <h2>About</h2>
            <img
                src="./images/profile.png"
                alt="프로필 이미지"
            >
            <p>자기소개</p>
        </section>

        <section id="skills">
            <h2>Skills</h2>
            <ul>
                <li>JS</li>
                <li>Java</li>
                <li>Python</li>
            </ul>
        </section>

        <section id="projects">
            <h2>Projects</h2>
            <div id="project-list" aria-live="polite"></div>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <form id="contact-form">
                <div>
                    <label for="name">이름</label>
                    <input
                        id="name"
                        name="name"
                        type="text"
                        autocomplete="name"
                        aria-describedby="name-error"
                        required
                    >
                    <p id="name-error" class="field-error" aria-live="polite"></p>
                </div>

                <div>
                    <label for="email">이메일</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        aria-describedby="email-error"
                        required
                    >
                    <p id="email-error" class="field-error" aria-live="polite"></p>
                </div>

                <div>
                    <label for="message">메시지</label>
                    <textarea
                        id="message"
                        name="message"
                        aria-describedby="message-error"
                        required
                    ></textarea>
                    <p id="message-error" class="field-error" aria-live="polite"></p>
                </div>

                <button type="submit">보내기</button>
                <p id="form-status" role="status"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Lee</p>
        <a href="https://github.com/cdlwhdans">GitHub</a>
    </footer>
    <button id="scroll-top" type="button">맨 위로</button>
</body>
</html>
